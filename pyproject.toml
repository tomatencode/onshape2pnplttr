[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "onshape2pnplttr"
version = "0.1.0"
description = "Convert OnShape / CAD technical-drawing PDF exports into PenPlotterApp .pnplttr documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Simon" }]
keywords = ["pnplttr", "pen-plotter", "onshape", "cad", "pdf", "converter"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
onshape2pnplttr = "onshape2pnplttr.cli:main"
pnplttr-clean = "onshape2pnplttr.clean_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onshape2pnplttr = ["py.typed"]
